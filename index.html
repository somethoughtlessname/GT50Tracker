<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#243342">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="GT50">
    <meta name="description" content="Modular card-based productivity and tracking dashboard">

    <link rel="manifest" href="pwa/manifest.json">
    <link rel="apple-touch-icon" sizes="152x152" href="pwa/icons/icon-152.png">
    <link rel="apple-touch-icon" sizes="192x192" href="pwa/icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="pwa/icons/icon-512.png">
    <link rel="icon" type="image/png" sizes="32x32" href="pwa/icons/icon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="pwa/icons/icon-16.png">

    <title>GT50 Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
        }
        html { overflow-x: hidden; }
        body {
            background: var(--bg-1, #243342);
            color: #e4e4e7;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            padding: calc(var(--card-height, 45px) + 4px) 4px 4px;
        }
        body.build { padding-bottom: calc(45px + 8px); }
        #header { position: fixed; top: 0; left: 0; right: 0; z-index: 1001; }
        #footer { position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000; }
        /* Flex column like the original .card-container: each card keeps its own margins */
        #cards { width: 100%; display: flex; flex-direction: column; }
        .empty {
            margin-top: 8px;
            padding: 24px 12px;
            background: var(--bg-3);
            border: var(--border-width) solid var(--border-color);
            border-radius: 8px;
            text-align: center;
            color: var(--color-9);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="header"></div>
    <div id="cards"></div>
    <div id="footer"></div>

    <!-- ===== APP SHELL (always loaded) ===== -->
    <script src="shell/styles.js"></script>
    <script src="shell/registry.js"></script>
    <script src="shell/utils.js"></script>
    <script src="shell/header.js"></script>
    <script src="shell/footer.js"></script>

    <!-- ===== CARD TYPES (remove any line or file; the app keeps working) ===== -->
    <script src="comp/comp-list.js"></script>

    <script>
    (function() {
        const STORAGE_KEY = 'gt50-tracker-data';
        const U = GT50.Utils;

        // ===== STATE =====
        const saved = U.load(STORAGE_KEY) || {};
        const state = {
            title: saved.title || 'GT50 TRACKER',
            mode: 'view',   // always open on the main (view) window
            nextId: saved.nextId || 1,
            cards: Array.isArray(saved.cards) ? saved.cards : []
        };

        let pendingDeleteId = null;
        let deleteTimer = null;

        function save() {
            U.save(STORAGE_KEY, state);
        }
        const saveSoon = U.debounce(save, 400);

        // ===== CARD ACTIONS =====
        function addCard(type) {
            const def = GT50.getType(type);
            if (!def) return;
            state.cards.push({ id: state.nextId++, type: type, state: def.lib.defaultState() });
            update();
            window.scrollTo(0, document.body.scrollHeight);
        }

        function moveCard(id, dir) {
            const i = state.cards.findIndex(c => c.id === id);
            const j = i + dir;
            if (i < 0 || j < 0 || j >= state.cards.length) return;
            [state.cards[i], state.cards[j]] = [state.cards[j], state.cards[i]];
            update();
        }

        // First tap arms delete, second tap within 3s deletes
        function deleteCard(id) {
            clearTimeout(deleteTimer);
            if (pendingDeleteId === id) {
                state.cards = state.cards.filter(c => c.id !== id);
                pendingDeleteId = null;
            } else {
                pendingDeleteId = id;
                deleteTimer = setTimeout(() => { pendingDeleteId = null; render(); }, 3000);
            }
            update();
        }

        // ===== RENDER =====
        function missingCard(wrapper, card, isBuild) {
            const esc = U.escapeHTML;
            const armed = pendingDeleteId === card.id;
            wrapper.innerHTML = `
                <div style="
                    height: var(--card-height);
                    margin-bottom: var(--margin);
                    background: var(--bg-5);
                    border: var(--border-width) solid var(--border-color);
                    border-radius: 8px;
                    display: flex;
                    align-items: center;
                    overflow: hidden;
                    color: var(--color-10);
                ">
                    <div style="flex:1; padding: 0 12px; font-size: 12px; font-weight: 700; letter-spacing: 1px;">
                        ${esc(card.type.toUpperCase())} CARD — NOT INSTALLED
                    </div>
                    ${isBuild ? `<button data-action="delete" style="
                        width: 45px; height: 100%;
                        border: none; border-left: var(--border-width) solid var(--border-color);
                        background: ${armed ? 'var(--color-10)' : 'var(--color-1)'};
                        color: ${armed ? 'var(--color-1)' : 'var(--color-10)'};
                        font-size: 18px; font-weight: 700; cursor: pointer;
                    ">×</button>` : ''}
                </div>`;
            const del = wrapper.querySelector('[data-action="delete"]');
            if (del) del.onclick = () => deleteCard(card.id);
        }

        // View-mode dropdowns get even inner spacing (same rule as the original shell)
        function padDropdowns(wrapper) {
            wrapper.querySelectorAll('div[style*="border-radius: 0 0 8px 8px"]').forEach(section => {
                section.style.padding = 'var(--margin) var(--margin) 0 var(--margin)';
                const last = section.lastElementChild;
                if (last && !last.style.marginBottom) last.style.marginBottom = 'var(--margin)';
            });
        }

        function render() {
            const isBuild = state.mode === 'build';
            const scrollY = window.scrollY;
            document.body.classList.toggle('build', isBuild);

            GT50.Header.render(document.getElementById('header'), {
                title: state.title,
                mode: state.mode,
                onToggleMode: () => {
                    state.mode = isBuild ? 'view' : 'build';
                    pendingDeleteId = null;
                    update();
                }
            });

            const footer = document.getElementById('footer');
            if (isBuild) {
                footer.style.display = 'block';
                GT50.Footer.render(footer, { types: GT50.listTypes(), onAdd: addCard });
            } else {
                footer.style.display = 'none';
                footer.innerHTML = '';
            }

            const list = document.getElementById('cards');
            list.innerHTML = '';

            if (state.cards.length === 0) {
                list.innerHTML = `<div class="empty">${isBuild
                    ? 'NO CARDS YET — ADD ONE BELOW'
                    : 'NO CARDS YET — SWITCH TO BUILD TO ADD ONE'}</div>`;
            }

            state.cards.forEach(card => {
                const wrapper = document.createElement('div');
                list.appendChild(wrapper);
                const def = GT50.getType(card.type);

                if (!def) {
                    missingCard(wrapper, card, isBuild);
                    return;
                }

                try {
                    if (isBuild) {
                        def.lib.renderBuild(
                            wrapper, card.state, update,
                            (dir) => moveCard(card.id, dir),
                            () => deleteCard(card.id),
                            pendingDeleteId === card.id
                        );
                    } else {
                        def.lib.renderView(wrapper, card.state, update, null);
                        padDropdowns(wrapper);
                    }
                } catch (e) {
                    // One broken card must never take down the app
                    console.error('[GT50] card failed to render', card, e);
                    missingCard(wrapper, card, isBuild);
                }
            });

            window.scrollTo(0, scrollY);
        }

        function update() {
            save();
            render();
        }

        // Typing in a card edits state directly; save shortly after
        document.addEventListener('input', saveSoon);
        window.addEventListener('pagehide', save);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') save();
        });

        render();
    })();
    </script>

    <!-- ===== SERVICE WORKER ===== -->
    <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js', { scope: './' })
                .catch(err => console.warn('[PWA] SW registration failed:', err));
        });
    }
    </script>
</body>
</html>
