<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#243342">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="GT50">
    <meta name="description" content="Modular card-based productivity and tracking dashboard">

    <link rel="manifest" href="pwa/manifest.json">
    <link rel="apple-touch-icon" sizes="152x152" href="pwa/icons/icon-152.png">
    <link rel="apple-touch-icon" sizes="192x192" href="pwa/icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="pwa/icons/icon-512.png">
    <link rel="icon" type="image/png" sizes="32x32" href="pwa/icons/icon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="pwa/icons/icon-16.png">

    <title>GT50 Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
        }
        html { overflow-x: hidden; }
        body {
            background: var(--bg-1, #243342);
            color: #e4e4e7;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            /* top/bottom set from the header and footer heights */
            padding: 96px 4px 64px;
        }
        #header { position: fixed; top: 0; left: 0; right: 0; z-index: 1001; }
        #footer { position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000; }
        /* Flex column like the original .card-container: each card keeps its own margins */
        #cards { width: 100%; display: flex; flex-direction: column; }
        .empty {
            padding: 24px 12px;
            background: var(--bg-3);
            border: var(--border-width) solid var(--border-color);
            border-radius: 8px;
            text-align: center;
            color: var(--color-9);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="header"></div>
    <div id="cards"></div>
    <div id="footer"></div>

    <!-- ===== APP SHELL (always loaded) ===== -->
    <script src="shell/styles.js"></script>
    <script src="shell/registry.js"></script>
    <script src="shell/utils.js"></script>
    <script src="shell/header.js"></script>
    <script src="shell/sort.js"></script>
    <script src="shell/footer.js"></script>

    <!-- ===== CARD TYPES (remove any line or file; the app keeps working) ===== -->
    <script src="comp/comp-list.js"></script>

    <script>
    (function() {
        const STORAGE_KEY = 'gt50-tracker-data';
        const U = GT50.Utils;

        // ===== STATE =====
        const saved = U.load(STORAGE_KEY) || {};
        const state = {
            nextId: saved.nextId || 1,
            tabs: Array.isArray(saved.tabs) && saved.tabs.length ? saved.tabs : null,
            activeTab: saved.activeTab,
            sort: Object.assign(GT50.Sort.defaultState(), saved.sort || {})
        };
        if (!state.tabs) {
            // first run, or data from the single-list version: it becomes the first tab
            state.tabs = [{ id: state.nextId++, name: 'HOME', cards: Array.isArray(saved.cards) ? saved.cards : [] }];
        }
        if (!state.tabs.some(t => t.id === state.activeTab)) state.activeTab = state.tabs[0].id;

        // not saved: the app always opens on the main (view) window
        let mode = 'view';
        let query = '';
        let searching = false;
        let pendingDeleteId = null;   // card awaiting its second delete tap
        let tabDeleteArmed = false;   // tab awaiting its second delete tap
        let deleteTimer = null;

        function save() { U.save(STORAGE_KEY, state); }
        const saveSoon = U.debounce(save, 400);

        const activeTab = () => state.tabs.find(t => t.id === state.activeTab) || state.tabs[0];
        const cardInfo = (card) => {
            const def = GT50.getType(card.type);
            if (!def) return { title: card.type, done: false, text: card.type };
            try { return def.info(card.state) || {}; } catch (e) { return {}; }
        };
        const touch = (card) => { card.updated = Date.now(); };

        function disarm() {
            clearTimeout(deleteTimer);
            pendingDeleteId = null;
            tabDeleteArmed = false;
        }
        function armTimeout() {
            clearTimeout(deleteTimer);
            deleteTimer = setTimeout(() => { pendingDeleteId = null; tabDeleteArmed = false; render(); }, 3000);
        }

        // ===== TABS =====
        function selectTab(id) {
            if (id === state.activeTab) return;
            state.activeTab = id;
            disarm();
            update();
            window.scrollTo(0, 0);
        }
        function addTab() {
            const tab = { id: state.nextId++, name: 'TAB ' + (state.tabs.length + 1), cards: [] };
            state.tabs.push(tab);
            state.activeTab = tab.id;
            disarm();
            update();
        }
        function deleteTab() {
            if (state.tabs.length < 2) return;
            if (!tabDeleteArmed) {
                disarm();
                tabDeleteArmed = true;
                armTimeout();
                renderHeader();
                return;
            }
            const i = state.tabs.findIndex(t => t.id === state.activeTab);
            state.tabs.splice(i, 1);
            state.activeTab = state.tabs[Math.max(0, i - 1)].id;
            disarm();
            update();
        }

        // ===== CARDS =====
        function addCard(type) {
            const def = GT50.getType(type);
            if (!def) return;
            const now = Date.now();
            activeTab().cards.push({ id: state.nextId++, type: type, state: def.lib.defaultState(), added: now, updated: now });
            mode = 'build';   // a new card opens in edit so it can be set up
            disarm();
            update();
            window.scrollTo(0, document.body.scrollHeight);
        }
        function moveCard(id, dir) {
            const cards = activeTab().cards;
            const i = cards.findIndex(c => c.id === id);
            const j = i + dir;
            if (i < 0 || j < 0 || j >= cards.length) return;
            [cards[i], cards[j]] = [cards[j], cards[i]];
            update();
        }
        // First tap arms delete, second tap within 3s deletes
        function deleteCard(id) {
            if (pendingDeleteId === id) {
                activeTab().cards = activeTab().cards.filter(c => c.id !== id);
                disarm();
            } else {
                disarm();
                pendingDeleteId = id;
                armTimeout();
            }
            update();
        }

        // ===== RENDER =====
        function missingCard(wrapper, card, isBuild) {
            const armed = pendingDeleteId === card.id;
            wrapper.innerHTML = `
                <div style="
                    height: var(--card-height);
                    margin-bottom: var(--margin);
                    background: var(--bg-5);
                    border: var(--border-width) solid var(--border-color);
                    border-radius: 8px;
                    display: flex;
                    align-items: center;
                    overflow: hidden;
                    color: var(--color-10);
                ">
                    <div style="flex:1; padding: 0 12px; font-size: 12px; font-weight: 700; letter-spacing: 1px;">
                        ${U.escapeHTML(String(card.type).toUpperCase())} CARD — NOT INSTALLED
                    </div>
                    ${isBuild ? `<button data-action="delete" style="
                        width: 45px; height: 100%;
                        border: none; border-left: var(--border-width) solid var(--border-color);
                        background: ${armed ? 'var(--color-10)' : 'var(--color-1)'};
                        color: ${armed ? 'var(--color-1)' : 'var(--color-10)'};
                        font-size: 18px; font-weight: 700; cursor: pointer;
                    ">×</button>` : ''}
                </div>`;
            const del = wrapper.querySelector('[data-action="delete"]');
            if (del) del.onclick = () => deleteCard(card.id);
        }

        // View-mode dropdowns get even inner spacing (same rule as the original shell)
        function padDropdowns(wrapper) {
            wrapper.querySelectorAll('div[style*="border-radius: 0 0 8px 8px"]').forEach(section => {
                section.style.padding = 'var(--margin) var(--margin) 0 var(--margin)';
                const last = section.lastElementChild;
                if (last && !last.style.marginBottom) last.style.marginBottom = 'var(--margin)';
            });
        }

        function fitBody() {
            document.body.style.paddingTop = (document.getElementById('header').offsetHeight + 4) + 'px';
            document.body.style.paddingBottom = (document.getElementById('footer').offsetHeight + 4) + 'px';
        }

        function renderHeader(focusSearch) {
            const isBuild = mode === 'build';
            const tab = activeTab();
            const slot = GT50.Header.render(document.getElementById('header'), {
                tabs: state.tabs,
                activeId: tab.id,
                mode: mode,
                onTab: selectTab,
                onAddTab: addTab,
                onToggleMode: () => {
                    mode = isBuild ? 'view' : 'build';
                    disarm();
                    update();
                }
            });

            if (isBuild) {
                GT50.Header.renderTabEditor(slot, {
                    name: tab.name,
                    canDelete: state.tabs.length > 1,
                    armed: tabDeleteArmed,
                    onRename: (name) => {
                        tab.name = name.toUpperCase();
                        const el = document.querySelector('.gt-tab.active');
                        if (el) el.textContent = tab.name || 'TAB';
                        saveSoon();
                    },
                    onDelete: deleteTab
                });
            } else {
                GT50.Sort.renderBar(slot, {
                    sort: state.sort,
                    query: query,
                    searching: searching,
                    focus: focusSearch,
                    onOpenPage: () => GT50.Sort.openPage({
                        sort: state.sort,
                        onChange: (sort) => { state.sort = sort; save(); renderHeader(); renderCards(); },
                        onClose: () => window.scrollTo(0, 0)
                    }),
                    onSearchOpen: () => { searching = true; window.scrollTo(0, 0); },
                    onSearch: (q) => { query = q; renderCards(); },
                    onSearchClose: () => { searching = false; query = ''; renderCards(); window.scrollTo(0, 0); }
                });
            }
        }

        function renderFooter() {
            GT50.Footer.render(document.getElementById('footer'), { types: GT50.listTypes(), onAdd: addCard });
        }

        function renderCards() {
            const isBuild = mode === 'build';
            const tab = activeTab();
            const list = document.getElementById('cards');
            const scrollY = window.scrollY;
            list.innerHTML = '';

            // Edit mode always shows the built order; view mode applies sort, filter and search
            const cards = isBuild ? tab.cards : GT50.Sort.apply(tab.cards, state.sort, query, cardInfo);

            if (cards.length === 0) {
                const msg = tab.cards.length === 0
                    ? 'NO CARDS ON THIS TAB YET'
                    : (query ? 'NO CARDS MATCH YOUR SEARCH' : 'NO CARDS MATCH THIS FILTER');
                list.innerHTML = `<div class="empty">${msg}</div>`;
            }

            cards.forEach(card => {
                const wrapper = document.createElement('div');
                list.appendChild(wrapper);
                const def = GT50.getType(card.type);
                if (!def) { missingCard(wrapper, card, isBuild); return; }

                const onChange = () => { touch(card); update(); };
                // typing edits state directly: mark the card updated and save shortly after
                wrapper.addEventListener('input', () => { touch(card); saveSoon(); });

                try {
                    if (isBuild) {
                        def.lib.renderBuild(
                            wrapper, card.state, onChange,
                            (dir) => moveCard(card.id, dir),
                            () => deleteCard(card.id),
                            pendingDeleteId === card.id
                        );
                    } else {
                        def.lib.renderView(wrapper, card.state, onChange, null);
                        padDropdowns(wrapper);
                    }
                } catch (e) {
                    // One broken card must never take down the app
                    console.error('[GT50] card failed to render', card, e);
                    missingCard(wrapper, card, isBuild);
                }
            });

            window.scrollTo(0, scrollY);
        }

        function render() {
            renderHeader();
            renderFooter();
            renderCards();
            fitBody();
        }

        function update() {
            save();
            render();
        }

        window.addEventListener('pagehide', save);
        window.addEventListener('resize', fitBody);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') save();
        });

        render();
    })();
    </script>

    <!-- ===== SERVICE WORKER ===== -->
    <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js', { scope: './' })
                .catch(err => console.warn('[PWA] SW registration failed:', err));
        });
    }
    </script>
</body>
</html>
